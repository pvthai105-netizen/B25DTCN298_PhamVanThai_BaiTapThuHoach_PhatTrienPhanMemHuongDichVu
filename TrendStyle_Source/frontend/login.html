<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản | TrendStyle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a class="navbar-brand fs-2" href="index.html">Trend<span>Style</span></a>
          <p class="text-muted small mt-1">Đăng nhập để trải nghiệm mua sắm & bình luận thời trang</p>
        </div>

        <div class="card border rounded-0 p-4 shadow-sm bg-white">
          <form onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold text-uppercase">Tên đăng nhập hoặc Email</label>
              <input type="text" id="loginUsername" class="form-control rounded-0" required placeholder="admin hoặc phamthai">
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold text-uppercase">Mật khẩu</label>
                <a href="#" class="small text-muted text-decoration-none">Quên mật khẩu?</a>
              </div>
              <input type="password" id="loginPassword" class="form-control rounded-0" required placeholder="Nhập mật khẩu...">
            </div>

            <button type="submit" class="btn btn-dark w-100 rounded-0 py-2 fw-bold text-uppercase mb-3">
              ĐĂNG NHẬP
            </button>
          </form>

          <div class="alert alert-secondary small rounded-0 mb-3 p-2">
            <strong>Tài khoản mẫu đăng nhập thử:</strong><br>
            - Khách hàng: <code>phamthai</code> / mk: <code>123456</code><br>
            - Quản trị viên: <code>admin</code> / mk: <code>admin123</code>
          </div>

          <div class="text-center small text-muted">
            Chưa có tài khoản? <a href="register.html" class="fw-bold text-dark text-decoration-none">Đăng ký ngay</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="small text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay về trang chủ</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/app.js"></script>

  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value.trim();
      AppAuth.login(u, p);
    }
  </script>
</body>
</html>
