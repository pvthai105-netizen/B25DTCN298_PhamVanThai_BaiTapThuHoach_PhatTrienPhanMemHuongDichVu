<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Đơn Mua | TrendStyle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom py-3">
    <div class="container">
      <a class="navbar-brand" href="index.html">Trend<span>Style</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Cửa hàng</a></li>
          <li class="nav-item"><a class="nav-link" href="news.html">Xu Hướng & Tạp Chí</a></li>
        </ul>

        <div class="d-flex align-items-center">
          <a href="cart.html" class="btn btn-link text-dark position-relative me-3 p-0 fs-5">
            <i class="bi bi-bag"></i>
            <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark" style="font-size: 0.65rem; display:none;">0</span>
          </a>
          <div id="navUserArea"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="bg-light py-4 border-bottom mb-4">
    <div class="container">
      <h2 class="fw-bold mb-1">ĐƠN HÀNG CỦA TÔI</h2>
      <p class="text-secondary small mb-0">Theo dõi tiến độ giao hàng và lịch sử mua sắm thời trang</p>
    </div>
  </div>

  <div class="container mb-5">
    <div id="ordersContainer">
      <!-- Render danh sách đơn hàng -->
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center small text-secondary">
      &copy; 2026 TrendStyle Platform - Đồ án môn học Phát triển phần mềm hướng dịch vụ (PTIT).
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/app.js"></script>

  <script>
    function renderOrders() {
      const container = document.getElementById("ordersContainer");
      const orders = JSON.parse(localStorage.getItem("trendstyle_orders") || "[]");

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5">
            <i class="bi bi-box2 fs-1 text-muted"></i>
            <h5 class="mt-3 text-muted">Bạn chưa có đơn đặt hàng nào</h5>
            <a href="products.html" class="btn btn-dark btn-sm rounded-0 mt-2 px-3">Bắt đầu mua sắm</a>
          </div>
        `;
        return;
      }

      const statusBadges = {
        pending: '<span class="badge bg-warning text-dark">Chờ xác nhận</span>',
        confirmed: '<span class="badge bg-info text-dark">Đã xác nhận</span>',
        shipping: '<span class="badge bg-primary">Đang giao hàng</span>',
        delivered: '<span class="badge bg-success">Đã giao thành công</span>',
        cancelled: '<span class="badge bg-danger">Đã hủy</span>'
      };

      container.innerHTML = orders.map(o => `
        <div class="card border rounded-0 mb-4 shadow-sm">
          <div class="card-header bg-light d-flex justify-content-between align-items-center py-3">
            <div>
              <span class="fw-bold me-2">Mã đơn: ${o.order_code}</span>
              <span class="text-muted small">| Ngày đặt: ${o.created_at}</span>
            </div>
            <div>
              ${statusBadges[o.status] || '<span class="badge bg-secondary">Mới</span>'}
            </div>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-7 border-end">
                <h6 class="small fw-bold text-uppercase text-muted mb-2">Chi tiết sản phẩm:</h6>
                ${o.items.map(i => `
                  <div class="d-flex align-items-center mb-2 pb-2 border-bottom">
                    <img src="${i.product_thumbnail}" class="me-2 border" style="width: 45px; height: 55px; object-fit: cover;">
                    <div class="flex-grow-1">
                      <div class="small fw-bold text-truncate">${i.product_name}</div>
                      <div class="small text-muted">Số lượng: ${i.quantity} | Size: ${i.selected_size}</div>
                    </div>
                    <span class="small fw-bold">${AppUI.formatMoney(i.subtotal)}</span>
                  </div>
                `).join("")}
              </div>
              <div class="col-md-5 ps-md-4">
                <h6 class="small fw-bold text-uppercase text-muted mb-2">Địa chỉ nhận hàng:</h6>
                <div class="small mb-1"><strong>${o.receiver_name}</strong> - ${o.receiver_phone}</div>
                <div class="small text-secondary mb-3">${o.shipping_address}</div>

                <div class="border-top pt-2 small">
                  <div class="d-flex justify-content-between mb-1">
                    <span>Thanh toán:</span>
                    <span class="text-uppercase fw-semibold">${o.payment_method}</span>
                  </div>
                  <div class="d-flex justify-content-between mb-2">
                    <span>Tổng tiền thanh toán:</span>
                    <span class="fw-bold fs-6 text-dark">${AppUI.formatMoney(o.final_amount)}</span>
                  </div>
                  ${o.status === 'pending' ? `
                    <button class="btn btn-outline-danger btn-sm rounded-0 w-100" onclick="cancelOrder('${o.order_code}')">
                      <i class="bi bi-x-circle me-1"></i> Hủy đơn hàng này
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function cancelOrder(code) {
      if (confirm(`Bạn có chắc chắn muốn hủy đơn hàng ${code}?`)) {
        let orders = JSON.parse(localStorage.getItem("trendstyle_orders") || "[]");
        const target = orders.find(o => o.order_code === code);
        if (target) {
          target.status = "cancelled";
          localStorage.setItem("trendstyle_orders", JSON.stringify(orders));
          AppUI.showToast("Đã hủy đơn hàng thành công!");
          renderOrders();
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderOrders();
    });
  </script>
</body>
</html>
