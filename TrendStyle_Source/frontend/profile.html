<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân | TrendStyle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom py-3">
    <div class="container">
      <a class="navbar-brand" href="index.html">Trend<span>Style</span></a>
      <div class="d-flex align-items-center">
        <a href="cart.html" class="btn btn-link text-dark position-relative me-3 p-0 fs-5">
          <i class="bi bi-bag"></i>
          <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark" style="font-size: 0.65rem; display:none;">0</span>
        </a>
        <div id="navUserArea"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card border rounded-0 p-4 shadow-sm">
          <h4 class="fw-bold mb-4 pb-2 border-bottom">THÔNG TIN HỒ SƠ CÁ NHÂN</h4>
          
          <form onsubmit="handleSaveProfile(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Tên đăng nhập</label>
                <input type="text" id="profUsername" class="form-control rounded-0 bg-light" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Họ và tên</label>
                <input type="text" id="profFullName" class="form-control rounded-0" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Email</label>
                <input type="email" id="profEmail" class="form-control rounded-0 bg-light" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Số điện thoại</label>
                <input type="tel" id="profPhone" class="form-control rounded-0">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase">Địa chỉ giao hàng mặc định</label>
              <input type="text" id="profAddress" class="form-control rounded-0">
            </div>

            <button type="submit" class="btn btn-dark rounded-0 px-4 py-2 fw-bold text-uppercase btn-sm">
              LƯU THAY ĐỔI
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = AppStorage.getUser();
      if (!user) {
        alert("Vui lòng đăng nhập để xem thông tin hồ sơ!");
        window.location.href = "login.html";
        return;
      }
      document.getElementById("profUsername").value = user.username || "";
      document.getElementById("profFullName").value = user.full_name || "";
      document.getElementById("profEmail").value = (user.username === "phamthai") ? "thai.pham@student.ptit.edu.vn" : "admin@trendstyle.vn";
      document.getElementById("profPhone").value = (user.username === "phamthai") ? "0912345678" : "0988888888";
      document.getElementById("profAddress").value = (user.username === "phamthai") ? "Km10 Nguyễn Trãi, Hà Đông, Hà Nội" : "Học viện CNBCVT";
    });

    function handleSaveProfile(e) {
      e.preventDefault();
      const user = AppStorage.getUser();
      user.full_name = document.getElementById("profFullName").value.trim();
      AppStorage.setUser(user);
      AppUI.showToast("Cập nhật thông tin hồ sơ thành công!");
      AppUI.initNavbar();
    }
  </script>
</body>
</html>
