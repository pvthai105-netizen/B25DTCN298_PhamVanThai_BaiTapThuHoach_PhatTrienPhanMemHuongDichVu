<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản | TrendStyle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="text-center mb-4">
          <a class="navbar-brand fs-2" href="index.html">Trend<span>Style</span></a>
          <p class="text-muted small mt-1">Gia nhập cộng đồng người yêu thời trang TrendStyle</p>
        </div>

        <div class="card border rounded-0 p-4 shadow-sm bg-white">
          <form onsubmit="handleRegisterSubmit(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Tên đăng nhập *</label>
                <input type="text" id="regUsername" class="form-control rounded-0" required placeholder="nguyenvana">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Họ và tên *</label>
                <input type="text" id="regFullName" class="form-control rounded-0" required placeholder="Nguyễn Văn A">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold text-uppercase">Địa chỉ Email *</label>
              <input type="email" id="regEmail" class="form-control rounded-0" required placeholder="email@example.com">
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Số điện thoại</label>
                <input type="tel" id="regPhone" class="form-control rounded-0" placeholder="0987654321">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-uppercase">Mật khẩu *</label>
                <input type="password" id="regPassword" class="form-control rounded-0" required minlength="6" placeholder="Tối thiểu 6 ký tự">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase">Địa chỉ mặc định</label>
              <input type="text" id="regAddress" class="form-control rounded-0" placeholder="Số nhà, đường, quận/huyện...">
            </div>

            <button type="submit" class="btn btn-dark w-100 rounded-0 py-2 fw-bold text-uppercase mb-3">
              TẠO TÀI KHOẢN
            </button>
          </form>

          <div class="text-center small text-muted">
            Đã có tài khoản? <a href="login.html" class="fw-bold text-dark text-decoration-none">Đăng nhập</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="small text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay về trang chủ</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/app.js"></script>

  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const userData = {
        username: document.getElementById("regUsername").value.trim(),
        full_name: document.getElementById("regFullName").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        phone: document.getElementById("regPhone").value.trim(),
        password: document.getElementById("regPassword").value.trim(),
        address: document.getElementById("regAddress").value.trim()
      };
      AppAuth.register(userData);
    }
  </script>
</body>
</html>
